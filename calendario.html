<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Agregar a mi calendario · Catarsis</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<style>
:root{--bg:#EDE2CC;--card:#F7F1E6;--ink:#2a211a;--mut:#6b5a45;--line:#d6c7aa;--acc:#8a6428}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a16;--card:#282420;--ink:#f1e7d3;--mut:#c4b9a6;--line:#443c30;--acc:#d2bb94}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.c{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 18px}
.eb{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
h1{font:600 22px/1.25 Inter,system-ui,sans-serif;margin:0 0 4px}
.when{margin:0 0 4px;font-weight:600}.where{margin:0 0 18px;color:var(--mut);font-size:14px}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;cursor:pointer;color:inherit;font:inherit}
.o b{display:block;font-weight:600}.o small{display:block;color:var(--mut);font-size:13px}.o i{font-style:normal;font-size:26px;width:32px;text-align:center}
.hint{color:var(--mut);font-size:13px;margin:12px 0 0}
.err{color:var(--mut)}
</style>
</head>
<body>
<div class="c" id="c"><p class="err">Cargando…</p></div>
<script src="calendario.js"></script>
<script>
(function(){
  var e=CalCat.desdeEnlace(),c=document.getElementById('c');
  function esc(s){return String(s).replace(/[&<>"]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
  if(!e){c.innerHTML='<p class="eb">Catarsis</p><h1>No hay una hora para agregar</h1><p class="err">Vuelve a tocar el botón de calendario en la agenda.</p>';return}
  var DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var p=e.fecha.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),hh=function(m){return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  c.innerHTML='<p class="eb">Agregar a mi calendario</p><h1>'+esc(e.titulo)+'</h1><p class="when">'+DIA[d.getDay()]+' '+p[2]+' de '+MES[p[1]-1]+' · '+hh(e.hora)+' a '+hh(e.hora+e.dur)+'</p><p class="where">'+esc(e.lugar)+'</p>'+
    CalCat.opciones().map(function(o){return '<button type="button" class="o" data-k="'+o.k+'"><i>'+o.i+'</i><span><b>'+o.b+'</b><small>'+o.s+'</small></span></button>'}).join('')+
    '<p class="hint">'+(CalCat.esIOS()?'Si usas Chrome en iPhone y no se abre, abre esta página en Safari.':CalCat.esAndroid()?'Con «Calendario del teléfono» se descarga un archivo: tócalo y elige tu app de calendario.':'Con «Calendario del teléfono» se descarga un archivo .ics que abre Outlook, Calendario de Apple u otro.')+'</p>';
  c.addEventListener('click',function(ev){var b=ev.target.closest('[data-k]');if(b)CalCat.ejecutar(b.dataset.k,e)});
})();
</script>
</body>
</html>
